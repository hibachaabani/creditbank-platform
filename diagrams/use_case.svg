  <line x1="110" y1="455" x2="590" y2="180" stroke="#16a34a" stroke-width="1"/>
  <line x1="110" y1="460" x2="580" y2="245" stroke="#16a34a" stroke-width="1"/>
  <line x1="110" y1="465" x2="320" y2="335" stroke="#16a34a" stroke-width="1"/>
  <line x1="110" y1="470" x2="320" y2="405" stroke="#16a34a" stroke-width="1"/>
  <line x1="110" y1="475" x2="320" y2="630" stroke="#16a34a" stroke-width="1"/>
  <line x1="110" y1="480" x2="315" y2="700" stroke="#16a34a" stroke-width="1"/>
  <line x1="110" y1="485" x2="315" y2="770" stroke="#16a34a" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ASSOCIATIONS ANALYST (violet) -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="1290" y1="190" x2="810" y2="115" stroke="#7c3aed" stroke-width="1"/>
  <line x1="1290" y1="195" x2="810" y2="178" stroke="#7c3aed" stroke-width="1"/>
  <line x1="1290" y1="200" x2="820" y2="244" stroke="#7c3aed" stroke-width="1"/>
  <line x1="1290" y1="210" x2="1090" y2="330" stroke="#7c3aed" stroke-width="1"/>
  <line x1="1290" y1="215" x2="1090" y2="400" stroke="#7c3aed" stroke-width="1"/>
  <line x1="1290" y1="220" x2="1090" y2="470" stroke="#7c3aed" stroke-width="1"/>
  <line x1="1290" y1="225" x2="1090" y2="540" stroke="#7c3aed" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ASSOCIATIONS DECIDER (orange) -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="1290" y1="500" x2="810" y2="120" stroke="#b45309" stroke-width="1"/>
  <line x1="1290" y1="505" x2="810" y2="182" stroke="#b45309" stroke-width="1"/>
  <line x1="1290" y1="510" x2="820" y2="248" stroke="#b45309" stroke-width="1"/>
  <line x1="1290" y1="515" x2="1090" y2="405" stroke="#b45309" stroke-width="1"/>
  <line x1="1290" y1="520" x2="1100" y2="630" stroke="#b45309" stroke-width="1"/>
  <line x1="1290" y1="525" x2="1090" y2="700" stroke="#b45309" stroke-width="1"/>
  <line x1="1290" y1="530" x2="1090" y2="770" stroke="#b45309" stroke-width="1"/>
  <line x1="1290" y1="535" x2="815" y2="840" stroke="#b45309" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ASSOCIATIONS ADMIN (rouge) -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="1290" y1="755" x2="810" y2="118" stroke="#dc2626" stroke-width="1" stroke-dasharray="none"/>
  <line x1="1290" y1="760" x2="810" y2="183" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="765" x2="820" y2="250" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="770" x2="540" y2="330" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="773" x2="540" y2="400" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="776" x2="540" y2="630" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="779" x2="540" y2="700" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="782" x2="540" y2="770" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="785" x2="1090" y2="335" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="788" x2="1090" y2="408" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="791" x2="1090" y2="703" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="794" x2="1090" y2="773" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="797" x2="815" y2="843" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="800" x2="545" y2="843" stroke="#dc2626" stroke-width="1"/>
  <line x1="1290" y1="803" x2="1090" y2="843" stroke="#dc2626" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- RELATIONS <<include>> (pointillés vers S'authentifier) -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="430" y1="302" x2="640" y2="118" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="510" y="200" font-size="9" fill="#6b7280" transform="rotate(-25,510,200)">«include»</text>

  <line x1="430" y1="372" x2="635" y2="120" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="430" y1="442" x2="635" y2="121" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="430" y1="512" x2="635" y2="122" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="430" y1="602" x2="635" y2="123" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="430" y1="672" x2="635" y2="124" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="430" y1="742" x2="635" y2="125" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="302" x2="760" y2="120" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="372" x2="760" y2="121" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="442" x2="760" y2="122" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="512" x2="760" y2="123" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="602" x2="760" y2="124" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="672" x2="760" y2="125" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="742" x2="760" y2="126" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="700" y1="812" x2="700" y2="138" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="430" y1="812" x2="645" y2="130" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="970" y1="812" x2="755" y2="131" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Flèche include label unique -->
  <text x="700" y="700" font-size="10" fill="#6b7280" text-anchor="middle">— — — «include» —→ S'authentifier</text>

