<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Arial, sans-serif">

  <!-- Fond -->
  <rect width="1400" height="900" fill="#ffffff"/>

  <!-- Titre -->
  <text x="700" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">Diagramme de cas d'utilisation — Système CréditBank</text>

  <!-- Frontière du système -->
  <rect x="220" y="60" width="960" height="820" fill="none" stroke="#333" stroke-width="2" rx="8"/>
  <text x="240" y="85" font-size="14" font-style="italic" fill="#333">Système CréditBank</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ACTEURS (stickmen) -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- CLIENT (x=90) -->
  <circle cx="90" cy="210" r="20" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="90" y1="230" x2="90" y2="290" stroke="#2563eb" stroke-width="2"/>
  <line x1="55"  y1="255" x2="125" y2="255" stroke="#2563eb" stroke-width="2"/>
  <line x1="90"  y1="290" x2="65"  y2="330" stroke="#2563eb" stroke-width="2"/>
  <line x1="90"  y1="290" x2="115" y2="330" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">CLIENT</text>

  <!-- AGENT (x=90, y=470) -->
  <circle cx="90" cy="460" r="20" fill="none" stroke="#16a34a" stroke-width="2"/>
  <line x1="90" y1="480" x2="90" y2="540" stroke="#16a34a" stroke-width="2"/>
  <line x1="55"  y1="505" x2="125" y2="505" stroke="#16a34a" stroke-width="2"/>
  <line x1="90"  y1="540" x2="65"  y2="580" stroke="#16a34a" stroke-width="2"/>
  <line x1="90"  y1="540" x2="115" y2="580" stroke="#16a34a" stroke-width="2"/>
  <text x="90" y="600" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">AGENT</text>

  <!-- ANALYST (x=1310, y=180) -->
  <circle cx="1310" cy="180" r="20" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1310" y1="200" x2="1310" y2="260" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1275" y1="225" x2="1345" y2="225" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1310" y1="260" x2="1285" y2="300" stroke="#7c3aed" stroke-width="2"/>
  <line x1="1310" y1="260" x2="1335" y2="300" stroke="#7c3aed" stroke-width="2"/>
  <text x="1310" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">ANALYST</text>

  <!-- DECIDER (x=1310, y=490) -->
  <circle cx="1310" cy="490" r="20" fill="none" stroke="#b45309" stroke-width="2"/>
  <line x1="1310" y1="510" x2="1310" y2="570" stroke="#b45309" stroke-width="2"/>
  <line x1="1275" y1="535" x2="1345" y2="535" stroke="#b45309" stroke-width="2"/>
  <line x1="1310" y1="570" x2="1285" y2="610" stroke="#b45309" stroke-width="2"/>
  <line x1="1310" y1="570" x2="1335" y2="610" stroke="#b45309" stroke-width="2"/>
  <text x="1310" y="630" text-anchor="middle" font-size="14" font-weight="bold" fill="#b45309">DECIDER</text>

  <!-- ADMIN (x=1310, y=760) -->
  <circle cx="1310" cy="760" r="20" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="1310" y1="780" x2="1310" y2="840" stroke="#dc2626" stroke-width="2"/>
  <line x1="1275" y1="805" x2="1345" y2="805" stroke="#dc2626" stroke-width="2"/>
  <line x1="1310" y1="840" x2="1285" y2="870" stroke="#dc2626" stroke-width="2"/>
  <line x1="1310" y1="840" x2="1335" y2="870" stroke="#dc2626" stroke-width="2"/>
  <text x="1310" y="892" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">ADMIN</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CAS D'UTILISATION (ellipses) -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- S'authentifier (700, 110) -->
  <ellipse cx="700" cy="110" rx="110" ry="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="700" y="115" text-anchor="middle" font-size="12" fill="#1e3a8a">S'authentifier</text>

  <!-- Gérer son profil (700, 175) -->
  <ellipse cx="700" cy="175" rx="110" ry="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="700" y="180" text-anchor="middle" font-size="12" fill="#1e3a8a">Gérer son profil</text>

  <!-- Utiliser le chatbot IA (700, 240) -->
  <ellipse cx="700" cy="240" rx="120" ry="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="700" y="245" text-anchor="middle" font-size="12" fill="#1e3a8a">Utiliser le chatbot IA</text>

  <!-- Créer un dossier (430, 330) -->
  <ellipse cx="430" cy="330" rx="110" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="335" text-anchor="middle" font-size="12" fill="#14532d">Créer un dossier</text>

  <!-- Simuler un crédit (430, 400) -->
  <ellipse cx="430" cy="400" rx="110" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="405" text-anchor="middle" font-size="12" fill="#14532d">Simuler un crédit</text>

  <!-- Uploader des documents (430, 470) -->
  <ellipse cx="430" cy="470" rx="125" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="475" text-anchor="middle" font-size="12" fill="#14532d">Uploader des documents</text>

  <!-- Suivre son dossier (430, 540) -->
  <ellipse cx="430" cy="540" rx="110" ry="28" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="545" text-anchor="middle" font-size="12" fill="#14532d">Suivre son dossier</text>

  <!-- Réviser un dossier (430, 630) -->
  <ellipse cx="430" cy="630" rx="110" ry="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="430" y="635" text-anchor="middle" font-size="12" fill="#713f12">Réviser un dossier</text>

  <!-- Valider des documents (430, 700) -->
  <ellipse cx="430" cy="700" rx="115" ry="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="430" y="705" text-anchor="middle" font-size="12" fill="#713f12">Valider des documents</text>

  <!-- Affecter un analyste (430, 770) -->
  <ellipse cx="430" cy="770" rx="115" ry="28" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="430" y="775" text-anchor="middle" font-size="12" fill="#713f12">Affecter un analyste</text>

  <!-- Lancer l'analyse IA (970, 330) -->
  <ellipse cx="970" cy="330" rx="120" ry="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="970" y="335" text-anchor="middle" font-size="12" fill="#3b0764">Lancer l'analyse IA</text>

  <!-- Consulter le score ML (970, 400) -->
  <ellipse cx="970" cy="400" rx="120" ry="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="970" y="405" text-anchor="middle" font-size="12" fill="#3b0764">Consulter le score ML</text>

  <!-- Rédiger le rapport (970, 470) -->
  <ellipse cx="970" cy="470" rx="120" ry="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="970" y="475" text-anchor="middle" font-size="12" fill="#3b0764">Rédiger le rapport</text>

  <!-- Soumettre l'analyse (970, 540) -->
  <ellipse cx="970" cy="540" rx="120" ry="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="970" y="545" text-anchor="middle" font-size="12" fill="#3b0764">Soumettre l'analyse</text>

  <!-- Voir dossiers en attente (970, 630) -->
  <ellipse cx="970" cy="630" rx="130" ry="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="970" y="635" text-anchor="middle" font-size="12" fill="#78350f">Voir dossiers en attente</text>

  <!-- Approuver un crédit (970, 700) -->
  <ellipse cx="970" cy="700" rx="120" ry="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="970" y="705" text-anchor="middle" font-size="12" fill="#78350f">Approuver un crédit</text>

  <!-- Refuser un crédit (970, 770) -->
  <ellipse cx="970" cy="770" rx="120" ry="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="970" y="775" text-anchor="middle" font-size="12" fill="#78350f">Refuser un crédit</text>

  <!-- Accord conditionnel (700, 840) -->
  <ellipse cx="700" cy="840" rx="115" ry="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="700" y="845" text-anchor="middle" font-size="12" fill="#78350f">Accord conditionnel</text>

  <!-- Gérer les utilisateurs (500, 840) — on le décale -->
  <ellipse cx="430" cy="840" rx="115" ry="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="430" y="845" text-anchor="middle" font-size="12" fill="#7f1d1d">Gérer les utilisateurs</text>

  <!-- Consulter les rapports (970, 840) -->
  <ellipse cx="970" cy="840" rx="120" ry="28" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="970" y="845" text-anchor="middle" font-size="12" fill="#7f1d1d">Consulter les rapports</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ASSOCIATIONS CLIENT (bleu) -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="110" y1="220" x2="590" y2="110" stroke="#2563eb" stroke-width="1"/>
  <line x1="110" y1="230" x2="590" y2="175" stroke="#2563eb" stroke-width="1"/>
  <line x1="110" y1="240" x2="580" y2="240" stroke="#2563eb" stroke-width="1"/>
  <line x1="110" y1="250" x2="320" y2="330" stroke="#2563eb" stroke-width="1"/>
